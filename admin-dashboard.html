<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UICT Attendance — Admin Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#0b1f3a;font:15px Arial,sans-serif}header{background:#0b1f3a;color:white;padding:20px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0b1f3a12}input,button{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#0b1f3a;color:white;cursor:pointer}input{max-width:100%;margin:4px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #e2e8f0}th{background:#f8fafc}.muted{color:#64748b}.row{display:flex;gap:8px;flex-wrap:wrap}#app{display:none}.session{width:100%;text-align:left;background:white;color:#0b1f3a;border:1px solid #e2e8f0;margin:6px 0}.session:hover{border-color:#0b1f3a}.badge{font-weight:bold} @media(max-width:650px){table{font-size:13px}th,td{padding:7px}}.topbar{display:flex;align-items:center;gap:12px}.profile-wrap{position:relative}.profile-btn{width:42px;height:42px;border-radius:50%;padding:0;font-size:19px;background:#fff;color:#0b1f3a;border:1px solid #cbd5e1}.profile-menu{position:absolute;right:0;top:50px;z-index:5;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px #0b1f3a22;padding:8px;min-width:150px}.profile-menu button{width:100%;text-align:left;background:#fff;color:#0b1f3a;border:0}.profile-menu[hidden],#detailScreen[hidden],#listScreen[hidden]{display:none!important}.back-btn{background:#fff;color:#0b1f3a;border:1px solid #cbd5e1;margin-bottom:12px}
</style></head><body><header><h2>UICT ATTENDANCE</h2><div>Admin attendance dashboard · Built by DIGITAL DYNAMOS</div></header><main>
<section id="login" class="card"><h3>Administrator sign in</h3><p class="muted">Use your existing UICT Attendance administrator account.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required autocomplete="username"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form><p id="message" role="status"></p></section>
<section id="app"><div class="topbar"><h2 style="flex:1">Sessions</h2><button id="refresh">Refresh</button><div class="profile-wrap"><button id="profileButton" class="profile-btn" type="button" aria-label="Profile menu" aria-expanded="false"><span aria-hidden="true">👤</span></button><div id="profileMenu" class="profile-menu" hidden><button id="logout" type="button">Log out</button></div></div></div><section id="listScreen"><div class="card"><p class="muted">Select a session to view its attendance and session details.</p><div id="sessions">Loading sessions…</div></div></section><section id="detailScreen" hidden><button id="backToSessions" class="back-btn" type="button">← Back to sessions</button><div class="card"><h3 id="detailTitle">Session</h3><div id="detail" class="muted">Attendance records will appear here.</div></div></section></section>
</main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,getDocs,doc,getDoc,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDOXht78tQrPF1m5gpmjYV-nm0e-OfFAdY',authDomain:'attendence-uict-bbit.firebaseapp.com',projectId:'attendence-uict-bbit',storageBucket:'attendence-uict-bbit.firebasestorage.app',messagingSenderId:'1046712358957',appId:'1:1046712358957:android:d0d86dabadbfc952e040a4'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let allSessions=[],allUsers=[],allProfiles=[],recordsBySession=new Map();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?((a/b)*100).toFixed(1)+'%':'—';
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='Signing in…';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(err){$('message').textContent='Sign-in failed: '+err.message}});
$('logout').onclick=async()=>{ $('profileMenu').hidden=true; $('profileButton').setAttribute('aria-expanded','false'); await signOut(auth)};$('profileButton').onclick=()=>{const open=$('profileMenu').hidden;$('profileMenu').hidden=!open;$('profileButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('.profile-wrap')){$('profileMenu').hidden=true;$('profileButton').setAttribute('aria-expanded','false')}});$('backToSessions').onclick=()=>{$('detailScreen').hidden=true;$('listScreen').hidden=false};$('refresh').onclick=()=>loadData();
onAuthStateChanged(auth,async user=>{if(!user){$('login').style.display='block';$('app').style.display='none';return}try{const profile=await getDoc(doc(db,'users',user.uid));if(!profile.exists()||profile.data().role!=='admin'||profile.data().status!=='active'){await signOut(auth);$('message').textContent='Access denied. An active administrator account is required.';return}$('login').style.display='none';$('app').style.display='block';await loadData()}catch(err){$('message').textContent='Could not verify administrator access: '+err.message;await signOut(auth)}});
async function loadData(){ $('sessions').textContent='Loading sessions…';try{const [ss,us]=await Promise.all([getDocs(collection(db,'sessions')),getDocs(collection(db,'users'))]);allSessions=ss.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.openedAt?.toDate?.()??'').localeCompare(String(a.openedAt?.toDate?.()??'')));allProfiles=us.docs.map(d=>({id:d.id,...d.data()}));allUsers=allProfiles.filter(u=>u.role==='student'&&u.status==='active');recordsBySession.clear();await Promise.all(allSessions.map(async s=>{const snap=await getDocs(collection(db,'sessions',s.id,'records'));recordsBySession.set(s.id,snap.docs.map(d=>({id:d.id,...d.data()})))}));renderSessions()}catch(err){$('sessions').textContent='Unable to load data: '+err.message}}
function lecturerForSession(s){const uid=s.openedBy||s.openedByUid||s.lecturerUid||s.createdBy||s.createdByUid||s.openedByUserId;const p=allProfiles.find(u=>u.id===uid);return p?(p.fullName||p.displayName||p.name||p.email||'Lecturer profile'):(s.lecturerName||s.openedByName||s.createdByName||'Name unavailable')}function renderSessions(){if(!allSessions.length){$('sessions').textContent='No sessions found.';return}$('sessions').innerHTML=allSessions.map(s=>{const rs=recordsBySession.get(s.id)||[],present=rs.filter(r=>r.status==='present').length;return '<button class="session" data-id="'+safe(s.id)+'"><strong>'+safe(s.title||'Untitled session')+'</strong><br><span class="muted">Opened by '+safe(lecturerForSession(s))+' · '+safe(s.status||'')+' · '+present+' present / '+allUsers.length+' active students · '+safe(s.openedAt?.toDate?.().toLocaleString?.()||'')+'</span></button>'}).join('');document.querySelectorAll('.session').forEach(b=>b.onclick=()=>renderDetail(b.dataset.id))}
function renderDetail(id){const s=allSessions.find(x=>x.id===id);if(!s)return;$('listScreen').hidden=true;$('detailScreen').hidden=false;window.scrollTo({top:0,behavior:'smooth'});const rs=recordsBySession.get(id)||[],present=rs.filter(r=>r.status==='present');$('detailTitle').textContent=(s.title||'Session')+' · Opened by '+lecturerForSession(s);const peers=allSessions.filter(x=>String(x.title||'').trim().toLowerCase()===String(s.title||'').trim().toLowerCase());const rows=present.map(r=>{let attended=0;for(const peer of peers){const pr=recordsBySession.get(peer.id)||[];if(pr.some(x=>(x.studentUid||x.id)===(r.studentUid||r.id)&&x.status==='present'))attended++}return {r,attended,total:peers.length}}).sort((a,b)=>String(a.r.studentName||'').localeCompare(String(b.r.studentName||'')));$('detail').innerHTML='<p><strong>Session attendance:</strong> '+present.length+' / '+allUsers.length+' active students ('+pct(present.length,allUsers.length)+')</p><p class="muted">Same-title sessions: '+peers.length+'. Per-student percentage = attended same-title sessions ÷ same-title sessions.</p>'+(rows.length?'<div style="overflow-x:auto"><table><thead><tr><th>Student</th><th>Student number</th><th>Checked in</th><th>Same-title attendance</th></tr></thead><tbody>'+rows.map(({r,attended,total})=>'<tr><td>'+safe(r.studentName||'—')+'</td><td>'+safe(r.studentNumber||'—')+'</td><td>'+safe(r.checkedAt?.toDate?.().toLocaleString?.()||'—')+'</td><td><span class="badge">'+pct(attended,total)+'</span> <span class="muted">('+attended+'/'+total+')</span></td></tr>').join('')+'</tbody></table></div>':'<p>No present attendance records for this session.</p>')}
</script></body></html>
