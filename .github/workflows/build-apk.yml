      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter analyze

      - name: Restore release signing configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          : "${ANDROID_STORE_PASSWORD:?Missing GitHub secret ANDROID_STORE_PASSWORD}"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/uict-attendance-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../keystore/uict-attendance-upload.jks
          EOF

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build apk --release --build-name=1.0.1 --build-number=2

      - name: Build release AAB
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build appbundle --release --build-name=1.0.1 --build-number=2

      - name: Build web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build web --release

      - name: Verify APK signature
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --verbose "$APK"; fi

      - name: Collect artifacts
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/web
          cp build/app/outputs/apk/release/*.apk release/UICT_ATTENDANCE_v1.0.1_build2.apk
          cp build/app/outputs/bundle/release/*.aab release/UICT_ATTENDANCE_v1.0.1_build2.aab
          cp -R build/web/. release/web/
          cd release
          zip -qr UICT_ATTENDANCE_WEB_v1.0.1_build2.zip web
          rm -rf web
          ls -lh *

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UICT-ATTENDANCE-APK-v1.0.1-build2
          path: ${{ env.PROJECT_ROOT }}/release/UICT_ATTENDANCE_v1.0.1_build2.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: UICT-ATTENDANCE-AAB-v1.0.1-build2
          path: ${{ env.PROJECT_ROOT }}/release/UICT_ATTENDANCE_v1.0.1_build2.aab
          retention-days: 30

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: UICT-ATTENDANCE-WEB-v1.0.1-build2
          path: ${{ env.PROJECT_ROOT }}/release/UICT_ATTENDANCE_WEB_v1.0.1_build2.zip
          retention-days: 30
