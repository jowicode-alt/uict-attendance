name: Build UICT Attendance APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q UICT_ATTENDANCE_Source_v1.0.0.zip -d source
          ROOT="$(find source -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "::error::No Flutter pubspec.yaml found in the source archive."
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Flutter project: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter analyze

      - name: Restore release signing configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEY_ALIAS:?Missing GitHub secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing GitHub secret ANDROID_KEY_PASSWORD}"
          : "${ANDROID_STORE_PASSWORD:?Missing GitHub secret ANDROID_STORE_PASSWORD}"
          mkdir -p android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/uict-attendance-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../keystore/uict-attendance-upload.jks
          EOF
          test -s android/keystore/uict-attendance-upload.jks
          test -s android/key.properties
          echo "Release signing material restored for this ephemeral runner."

      - name: Build release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build apk --release

      - name: Verify APK identity and integrity
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find build/app/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "apksigner not on PATH; skipping direct signature verification."
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/build/app/outputs/apk" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/UICT_ATTENDANCE.apk
          ls -lh release/UICT_ATTENDANCE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UICT-ATTENDANCE-APK
          path: release/UICT_ATTENDANCE.apk
          if-no-files-found: error
          retention-days: 14
