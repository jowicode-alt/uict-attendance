            FilledButton.icon(
"""
              if marker not in s: raise SystemExit("Student insertion marker missing")
              s=s.replace(marker,block,1)
              s=s.replace("class SummaryCard extends StatelessWidget {","""Map<String, List<AttendanceRecord>> _sessionSummaries(List<AttendanceRecord> records) {
  final grouped = <String, List<AttendanceRecord>>{};
  for (final record in records) {
    grouped.putIfAbsent(record.sessionTitle, () => []).add(record);
  }
  return grouped;
}

class SummaryCard extends StatelessWidget {""")
          p.write_text(s)

          edit("pubspec.yaml",[("version: 1.0.0+1","version: 1.0.1+2"),("  network_info_plus: ^8.2.1\n","")])
          edit("firestore.rules",[
              ("        && request.resource.data.wifiSsid in settings.allowedWifiSsids\n",""),
              ("""          'studentNumber', 'status', 'proofType', 'proofHash',
          'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'""",
               """          'studentNumber', 'status', 'proofType', 'proofHash',
          'deviceId', 'location', 'accuracyMeters', 'checkedAt'"""),
          ])

          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          s=s.replace('    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n','')
          s=s.replace('    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n','')
          p.write_text(s)

          p=Path("lib/main.dart"); s=p.read_text()
          if "firebase_options.dart" not in s:
              s=s.replace("import 'app.dart';","import 'app.dart';\nimport 'firebase_options.dart';")
          s=s.replace("await Firebase.initializeApp();","await Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform);")
          p.write_text(s)

          Path("lib/firebase_options.dart").write_text("""import 'package:firebase_core/firebase_core.dart';
import 'package:flutter/foundation.dart';

class DefaultFirebaseOptions {
  static FirebaseOptions get currentPlatform {
    if (kIsWeb) return web;
    switch (defaultTargetPlatform) {
      case TargetPlatform.android: return android;
