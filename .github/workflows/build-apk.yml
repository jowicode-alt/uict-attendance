                const SizedBox(height: 18),
"""+s[b:]
          w=s.find("                TextField(\n                  controller: _wifi,")
          if w>=0:
              e=s.index("                const SizedBox(height: 14),",w)
              e=s.index("\n",e)+1
              s=s[:w]+s[e:]
          p.write_text(s)

          p=Path("lib/screens/student_dashboard.dart"); s=p.read_text()
          s=s.replace("""                    const RequirementRow(
                      icon: Icons.wifi,
                      text: 'Connect to the approved classroom Wi-Fi',
                    ),
""","")
