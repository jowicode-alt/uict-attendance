name: Build UICT Attendance Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q UICT_ATTENDANCE_Source_v1.0.0.zip -d source
          ROOT="$(find source -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply only requested UICT updates
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def edit(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f"Expected source text not found in {path}: {old[:100]!r}")
                  s = s.replace(old, new)
              p.write_text(s)

          # User-facing branding and terminology only.
          for path in [
              "lib/services/app_constants.dart","lib/app.dart","lib/services/auth_service.dart",
              "lib/services/attendance_service.dart","lib/screens/mark_attendance_page.dart",
