              ("    required this.allowedWifiSsids,\n",""),
              ("  final List<String> allowedWifiSsids;\n",""),
              ("""      allowedWifiSsids: List<String>.from(
        data['allowedWifiSsids'] as List<dynamic>? ?? const <dynamic>[],
      ),
""",""),
              ("""  bool get isConfigured =>
      allowedWifiSsids.isNotEmpty && campusLocation != null && radiusMeters > 0;""",
               """  bool get isConfigured => campusLocation != null && radiusMeters > 0;"""),
          ])

          edit("lib/services/attendance_service.dart", [
              ("import 'package:network_info_plus/network_info_plus.dart';\n",""),
              ("  final NetworkInfo _networkInfo = NetworkInfo();\n",""),
              ("    required List<String> wifiSsids,\n",""),
              ("""    final cleaned = wifiSsids
        .map((value) => value.trim().replaceAll('"', ''))
        .where((value) => value.isNotEmpty)
        .toSet()
        .toList();
    if (cleaned.isEmpty) {
      throw const AttendanceException('Add at least one classroom Wi-Fi name.');
    }
    await _db.collection('settings').doc('attendance').set({
      'allowedWifiSsids': cleaned,
""","""    await _db.collection('settings').doc('attendance').set({
"""),
              ("Configure classroom Wi-Fi and GPS settings before opening attendance.",
               "Configure the attendance location settings before opening attendance."),
              ("""    // Android and iOS expose the Wi-Fi name only after location permission is
    // granted, so resolve permission and position before reading the SSID.
    final position = await currentPosition();
    final wifiName = (await _networkInfo.getWifiName())
        ?.replaceAll('"', '')
        .trim();
    if (wifiName == null || wifiName.isEmpty) {
