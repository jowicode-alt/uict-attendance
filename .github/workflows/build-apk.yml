  static const FirebaseOptions android = FirebaseOptions(
    apiKey: 'AIzaSyDOXht78tQrPF1m5gpmjYV-nm0e-OfFAdY',
    appId: '1:1046712358957:android:d0d86dabadbfc952e040a4',
