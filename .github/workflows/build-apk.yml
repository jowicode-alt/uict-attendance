              ("        wifiSsids: _wifi.text.split(','),\n",""),
              ("Use This Phone’s Current Location","Use This Device’s Current Location"),
          ])
          p=Path("lib/screens/admin_settings_page.dart"); s=p.read_text()
          a=s.index("                Card(\n                  color: Theme.of(context).colorScheme.primaryContainer,")
          b=s.index("                TextField(\n                  controller: _campusName,",a)
