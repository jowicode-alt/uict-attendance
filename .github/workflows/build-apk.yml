          edit("lib/screens/admin_settings_page.dart", [
              ("  final _wifi = TextEditingController();\n",""),
              ("    _wifi.text = settings.allowedWifiSsids.join(', ');\n",""),
              ("    _wifi.dispose();\n",""),
              ("    if (_wifi.text.trim().isEmpty || latitude == null || longitude == null) {",
               "    if (latitude == null || longitude == null) {"),
              ("Enter Wi-Fi names and capture or enter valid campus coordinates.",
