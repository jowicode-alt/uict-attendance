name: Build Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uict-web-build
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q UICT_ATTENDANCE_Source_v1.0.0.zip -d source
          ROOT="$(find source -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply requested branding update only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          replacements = {
              'Built by WIZZARD NATION': 'Built by DIGITAL DYNAMOS',
              'Built by Wizzard Nation': 'Built by DIGITAL DYNAMOS',
              'WIZZARD NATION': 'DIGITAL DYNAMOS',
              'Wizzard Nation': 'DIGITAL DYNAMOS',
              'wizzard nation': 'digital dynamos',
              "Use this phone's current location": "Use this device's current location",
          }
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Branding files changed:', changed if changed else 'none')
          PY

      - name: Apply GPS wording update only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          old_re = re.compile(r"Use this\s+phone['’]s\s+current\s+location", re.IGNORECASE)
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = old_re.sub("Use this device's current location", text)
              new = new.replace("Text('Use this device's current location')", 'Text("Use this device\'s current location")')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('GPS wording files changed:', changed if changed else 'none')
          matches = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  t = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if "Use this phone's current location" in t or "Use this phone’s current location" in t:
                  raise SystemExit(f"Old GPS wording remains in {p}")
              if "Use this device's current location" in t:
                  matches.append(str(p))
          if not matches:
              # The source may use escaped/generated text; report all current-location occurrences for diagnosis.
              for p in root.rglob('*'):
                  if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                      continue
                  try:
                      t = p.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  if 'current location' in t.lower():
                      print(f"CURRENT LOCATION TEXT in {p}:")
                      for line in t.splitlines():
                          if 'current location' in line.lower():
                              print(line[:500])
              raise SystemExit("Could not confirm the requested GPS wording in source")
          print('GPS wording verified:', matches)
          PY

      - name: Apply Lecturer terminology update only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          term_re = re.compile(r'(?i)\b(administrators?|admins?)\b')

          # Only rewrite strings that are actually used as UI text.
          # Do not rewrite arbitrary quoted values because they may be
          # authentication/role/database identifiers.
          ui_markers = (
              'Text(', 'RichText(', 'TextSpan(', 'AppBar(', 'SnackBar(',
              'AlertDialog(', 'SimpleDialog(', 'showDialog(', 'showSnackBar(',
              'labelText:', 'hintText:', 'helperText:', 'errorText:',
              'tooltip:', 'title:', 'subtitle:', 'message:', 'content:',
              'description:', 'semanticLabel:', 'buttonText:', 'emptyText:',
          )

          def change_body(body):
              # Preserve exact role values, including capitalization.
              if body.strip().lower() in {'administrator', 'administrators', 'admin', 'admins'}:
                  return body
              return term_re.sub(
                  lambda m: (
                      'Lecturers' if m.group(0).lower() in {'administrators', 'admins'} else 'Lecturer'
                  ) if m.group(0)[0].isupper() else (
                      'lecturers' if m.group(0).lower() in {'administrators', 'admins'} else 'lecturer'
                  ),
                  body
              )

          def transform_ui_strings(text):
              out = []
              i = 0
              changed = False
              n = len(text)
              while i < n:
                  if text.startswith("'''", i) or text.startswith('"""', i):
                      quote = text[i:i+3]
                      j = i + 3
                      while j < n:
                          if text.startswith(quote, j) and (j == 0 or text[j-1] != '\\'):
                              body = text[i+3:j]
                              # Look back to the nearby code for a UI constructor/property.
                              prefix = text[max(0, i-250):i]
                              if any(marker in prefix for marker in ui_markers):
                                  new_body = change_body(body)
                              else:
                                  new_body = body
                              changed |= new_body != body
                              out.append(quote + new_body + quote)
                              i = j + 3
                              break
                          j += 1
                      else:
                          out.append(text[i:])
                          i = n
                      continue

                  if text[i] in ("'", '"'):
                      quote = text[i]
                      j = i + 1
                      body = []
                      while j < n:
                          if text[j] == '\\' and j + 1 < n:
                              body.extend([text[j], text[j+1]])
                              j += 2
                              continue
                          if text[j] == quote:
                              break
                          body.append(text[j])
                          j += 1
                      if j >= n:
                          out.append(text[i:])
                          i = n
                          continue
                      body_text = ''.join(body)
                      prefix = text[max(0, i-250):i]
                      if any(marker in prefix for marker in ui_markers):
                          new_body = change_body(body_text)
                      else:
                          new_body = body_text
                      changed |= new_body != body_text
                      out.append(quote + new_body + quote)
                      i = j + 1
                      continue

                  out.append(text[i])
                  i += 1
              return ''.join(out), changed

          changed_files = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new, changed = transform_ui_strings(text)
              if changed:
                  p.write_text(new, encoding='utf-8')
                  changed_files.append(str(p))

          print('Lecturer terminology files changed:', changed_files if changed_files else 'none')

          # Verify the requested UI terminology is gone from UI strings only.
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              transformed, _ = transform_ui_strings(text)
              if transformed != text:
                  raise SystemExit(f"Lecturer terminology transformation was not stable in {p}")

          print("Lecturer terminology update verified without rewriting non-UI string values.")
          PY

      - name: Remove Wi-Fi verification only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"Required source file missing: {path}")
              old = p.read_text(encoding="utf-8")
              new = fn(old)
              p.write_text(new, encoding="utf-8")
              print(f"updated {path}")

          # Keep stored Wi-Fi configuration fields for backward compatibility.
          def model(s):
              lines = s.splitlines()
              hit = next((i for i, line in enumerate(lines) if "bool get isConfigured =>" in line), None)
              if hit is None:
                  raise SystemExit("isConfigured getter not found")
              end = None
              for j in range(hit, min(len(lines), hit + 30)):
                  if ";" in lines[j]:
                      end = j
                      break
              if end is None:
                  raise SystemExit("Could not safely determine end of isConfigured getter")
              lines[hit:end + 1] = [
                  "  bool get isConfigured => campusLocation != null && radiusMeters > 0;"
              ]
              return "\n".join(lines) + "\n"
          edit("lib/models/attendance_models.dart", model)

          def remove_service_wifi(s):
              s = s.replace("import 'package:network_info_plus/network_info_plus.dart';\n", "")
              s = s.replace("  final NetworkInfo _networkInfo = NetworkInfo();\n", "")
              s = s.replace("    required List<String> wifiSsids,\n", "")
              s = re.sub(r"(?m)^\s*wifiSsids:\s*[^,\n]+,\s*$", "", s)
              # Remove the legacy saveSettings() Wi-Fi normalization/write block.
              lines0 = s.splitlines()
              cleaned0 = []
              skip = False
              for line in lines0:
                  if line.strip().startswith("final cleaned = wifiSsids"):
                      skip = True
                      continue
                  if skip:
                      if line.strip() == ".toList();":
                          skip = False
                      continue
                  if "'allowedWifiSsids': cleaned" in line:
                      continue
                  cleaned0.append(line)
              if skip:
                  raise SystemExit("Could not safely remove legacy Wi-Fi settings block")
              s = "\n".join(cleaned0) + "\n"
              s = re.sub(r"(?m)^\s*['\"]wifiSsid['\"]:\s*[^,\n]+,\s*$", "", s)
              s = re.sub(r"(?m)^\s*(?:final|var)\s+wifiName\s*=.*$", "", s)

              lines = s.splitlines()
              for _ in range(20):
                  targets = [i for i, line in enumerate(lines) if "allowedWifiSsids" in line]
                  if not targets:
                      break
                  target = targets[0]
                  block_start = None
                  for i in range(target, max(-1, target - 100), -1):
                      if re.match(r"^\s*if\b.*\{\s*$", lines[i]):
                          block_start = i
                          break
                  if block_start is None:
                      raise SystemExit("Found allowedWifiSsids but could not safely identify its if-block")
                  depth = 0
                  block_end = None
                  for j in range(block_start, min(len(lines), target + 200)):
                      depth += lines[j].count("{") - lines[j].count("}")
                      if j > block_start and depth <= 0:
                          block_end = j
                          break
                  if block_end is None:
                      raise SystemExit("Found Wi-Fi if-block but could not safely determine its end")
                  del lines[block_start:block_end + 1]
              if any("allowedWifiSsids" in line for line in lines):
                  raise SystemExit("More than 20 Wi-Fi attendance blocks remain; refusing unsafe edit")
              return "\n".join(lines) + "\n"

          edit("lib/services/attendance_service.dart", remove_service_wifi)

          def remove_admin_wifi(s):
              s = s.replace("  final _wifi = TextEditingController();\n", "")
              s = s.replace("    _wifi.text = settings.allowedWifiSsids.join(', ');\n", "")
              s = s.replace("    _wifi.dispose();\n", "")
              s = s.replace("        wifiSsids: _wifi.text.split(','),\n", "")
              s = s.replace("if (_wifi.text.trim().isEmpty || latitude == null || longitude == null)",
                            "if (latitude == null || longitude == null)")
              s = s.replace("'Enter Wi-Fi names and capture or enter valid campus coordinates.'",
                            "'Capture or enter valid campus coordinates.'")
              s = s.replace("Students must match both an approved Wi-Fi name and the GPS radius below. Wi-Fi names are case-sensitive.",
                            "Students must be inside the approved GPS attendance area below and use the live session QR or code.")

              lines = s.splitlines()
              for _ in range(10):
                  hits = [i for i, line in enumerate(lines) if "_wifi" in line and "controller:" in line]
                  if not hits:
                      break
                  hit = hits[0]
                  start = None
                  for i in range(hit, max(-1, hit - 50), -1):
                      if "TextField(" in lines[i]:
                          start = i
                          break
                  if start is None:
                      raise SystemExit("Found Wi-Fi TextField controller but could not locate its TextField start")
                  depth = 0
                  end = None
                  for j in range(start, min(len(lines), hit + 120)):
                      depth += lines[j].count("(") - lines[j].count(")")
                      if j > start and depth <= 0:
                          end = j
                          break
                  if end is None:
                      raise SystemExit("Found Wi-Fi TextField but could not safely determine its end")
                  del lines[start:end + 1]
              return "\n".join(lines) + "\n"

          edit("lib/screens/admin_settings_page.dart", remove_admin_wifi)

          edit("lib/screens/student_dashboard.dart", lambda s: re.sub(
              r"\n\s*const RequirementRow\(\n\s*icon:\s*Icons\.wifi,\n\s*text:\s*'Connect to the approved classroom Wi-Fi',\n\s*\),",
              "", s, count=1))

          def rules(s):
              s = s.replace("        && request.resource.data.wifiSsid in settings.allowedWifiSsids\n", "")
              s = s.replace("'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'",
                            "'deviceId', 'location', 'accuracyMeters', 'checkedAt'")
              return s
          edit("firestore.rules", rules)

          # Remove any remaining standalone Wi-Fi validation blocks that depended on
          # wifiName/cleaned variables. Each removal is bounded and only targets the
          # exact legacy guard, never GPS/session/device logic.
          def remove_guard(s, marker):
              lines = s.splitlines()
              while True:
                  hit = next((i for i, line in enumerate(lines) if marker in line), None)
                  if hit is None:
                      return "\n".join(lines) + "\n"
                  start = None
                  for i in range(hit, max(-1, hit - 30), -1):
                      if re.match(r"^\s*if\s*\(", lines[i]):
                          start = i
                          break
                  if start is None:
                      raise SystemExit(f"Could not safely locate guard for {marker}")
                  depth = 0
                  end = None
                  for j in range(start, min(len(lines), hit + 80)):
                      depth += lines[j].count("{") - lines[j].count("}")
                      if j > start and depth <= 0:
                          end = j
                          break
                  if end is None:
                      raise SystemExit(f"Could not safely determine end of guard for {marker}")
                  del lines[start:end + 1]

          svc = Path("lib/services/attendance_service.dart").read_text(encoding="utf-8")
          svc = remove_guard(svc, "if (cleaned.isEmpty)")
          svc = remove_guard(svc, "if (wifiName == null || wifiName.isEmpty)")
          # Remove any orphaned Wi-Fi normalization chain left without its declaration.
          lines = svc.splitlines()
          out = []
          skip_chain = False
          for line in lines:
              stripped = line.strip()
              if "?.replaceAll" in stripped or stripped == ".trim();":
                  continue
              out.append(line)
          svc = "\n".join(out) + "\n"
          Path("lib/services/attendance_service.dart").write_text(svc, encoding="utf-8")

          # Hard validation: Wi-Fi must not remain in the attendance decision path.
          for path in ["lib/services/attendance_service.dart", "firestore.rules"]:
              text = Path(path).read_text(encoding="utf-8")
              if re.search(r"network_info_plus|getWifiName|_networkInfo|wifiSsid|allowedWifiSsids", text):
                  raise SystemExit(f"Wi-Fi attendance reference remains in {path}")
          print("Wi-Fi verification removed. GPS, QR/code, sessions, device checks and other checks are preserved.")
          PY

      - name: Apply named-session attendance percentage update only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          # The existing session model already creates a unique Firestore
          # sessions/{sessionId} document for every opened session. This update
          # keeps that behavior and only adds course/name-based aggregation.
          report = root / "lib/services/report_service.dart"
          text = report.read_text(encoding="utf-8")

          class_marker = "class ReportService {"
          if "class CourseAttendanceSummary" not in text:
              course_class = """class CourseAttendanceSummary {
                const CourseAttendanceSummary({
                  required this.courseName,
                  required this.attended,
                  required this.totalSessions,
                });

                final String courseName;
                final int attended;
                final int totalSessions;

                double get percentage =>
                    totalSessions == 0 ? 0 : attended * 100 / totalSessions;
              }

              """
              text = text.replace(class_marker, course_class + class_marker, 1)

          method_marker = "  AttendanceSummary summarize(List<AttendanceRecord> records) {"
          if "List<CourseAttendanceSummary> summarizeByCourse" not in text:
              method = """  List<CourseAttendanceSummary> summarizeByCourse(
                List<AttendanceRecord> records,
              ) {
                final groups = <String, List<AttendanceRecord>>{};
                for (final record in records) {
                  final displayName = record.sessionTitle.trim().isEmpty
                      ? 'Attendance session'
                      : record.sessionTitle.trim();
                  final key = displayName.toLowerCase();
                  groups.putIfAbsent(key, () => []).add(record);
                }

                final summaries = groups.entries.map((entry) {
                  final courseRecords = entry.value;
                  final displayName = courseRecords.first.sessionTitle.trim().isEmpty
                      ? 'Attendance session'
                      : courseRecords.first.sessionTitle.trim();
                  final attended =
                      courseRecords.where((record) => record.isPresent).length;
                  return CourseAttendanceSummary(
                    courseName: displayName,
                    attended: attended,
                    totalSessions: courseRecords.length,
                  );
                }).toList();

                summaries.sort(
                  (a, b) => a.courseName.toLowerCase().compareTo(
                    b.courseName.toLowerCase(),
                  ),
                );
                return summaries;
              }

          """
              if method_marker not in text:
                  raise SystemExit("ReportService summarize marker not found")
              text = text.replace(method_marker, method + method_marker, 1)

          report.write_text(text, encoding="utf-8")

          student = root / "lib/screens/student_dashboard.dart"
          text = student.read_text(encoding="utf-8")

          old_rate = """                Expanded(
                  child: SummaryCard(
                    label: 'Rate',
                    value: '${summary.percentage.toStringAsFixed(0)}%',
                    icon: Icons.percent,
                    color: Theme.of(context).colorScheme.secondary,
                  ),
                ),"""
          new_rate = """                Expanded(
                  child: SummaryCard(
                    label: 'Sessions',
                    value: '${summary.sessions}',
                    icon: Icons.event_note_outlined,
                    color: Theme.of(context).colorScheme.secondary,
                  ),
                ),"""
          if old_rate not in text:
              raise SystemExit("Student dashboard global Rate card not found")
          text = text.replace(old_rate, new_rate, 1)

          anchor = """            const SizedBox(height: 22),
            FilledButton.icon(
              onPressed: () => Navigator.push("""
          course_block = """            const SizedBox(height: 22),
            Text(
              'Attendance by course',
              style: Theme.of(context).textTheme.titleMedium
                  ?.copyWith(fontWeight: FontWeight.w800),
            ),
            const SizedBox(height: 9),
            if (ReportService.instance.summarizeByCourse(records).isEmpty)
              const Card(
                child: ListTile(
                  leading: Icon(Icons.school_outlined),
                  title: Text('No completed sessions yet'),
                ),
              )
            else
              ...ReportService.instance.summarizeByCourse(records).map(
                (course) => Padding(
                  padding: const EdgeInsets.only(bottom: 8),
                  child: Card(
                    child: ListTile(
                      leading: const Icon(Icons.school_outlined),
                      title: Text(
                        course.courseName,
                        style: const TextStyle(fontWeight: FontWeight.w800),
                      ),
                      subtitle: Text(
                        '${course.attended} attended / ${course.totalSessions} sessions',
                      ),
                      trailing: Text(
                        '${course.percentage.toStringAsFixed(2)}%',
                        style: const TextStyle(fontWeight: FontWeight.w900),
                      ),
                    ),
                  ),
                ),
              ),
            const SizedBox(height: 22),
            FilledButton.icon(
              onPressed: () => Navigator.push("""
          if anchor not in text:
              raise SystemExit("Student dashboard insertion anchor not found")
          text = text.replace(anchor, course_block, 1)
          student.write_text(text, encoding="utf-8")

          admin = root / "lib/screens/admin_reports_page.dart"
          text = admin.read_text(encoding="utf-8")
          old_group = """      final groups = <String, List<AttendanceRecord>>{};
      for (final record in records) {
        groups.putIfAbsent(record.studentUid, () => []).add(record);
      }
      final studentSummaries = groups.values.toList()
        ..sort((a, b) => a.first.studentName.compareTo(b.first.studentName));"""
          new_group = """      final groups = <String, List<AttendanceRecord>>{};
      for (final record in records) {
        final courseKey = record.sessionTitle.trim().toLowerCase();
        final key = '${record.studentUid}::$courseKey';
        groups.putIfAbsent(key, () => []).add(record);
      }
      final studentSummaries = groups.values.toList()
        ..sort((a, b) {
          final studentCompare =
              a.first.studentName.compareTo(b.first.studentName);
          if (studentCompare != 0) return studentCompare;
          return a.first.sessionTitle.toLowerCase().compareTo(
            b.first.sessionTitle.toLowerCase(),
          );
        });"""
          if old_group not in text:
              raise SystemExit("Admin report student grouping block not found")
          text = text.replace(old_group, new_group, 1)

          old_row = """                    title: Text(
                      studentRecords.first.studentName,
                      style: const TextStyle(fontWeight: FontWeight.w700),
                    ),
                    subtitle: Text(
                      '${studentRecords.first.studentNumber} • ${studentSummary.present}/${studentSummary.totalRecords} present',
                    ),"""
          new_row = """                    title: Text(
                      '${studentRecords.first.studentName} • ${studentRecords.first.sessionTitle}',
                      style: const TextStyle(fontWeight: FontWeight.w700),
                    ),
                    subtitle: Text(
                      '${studentRecords.first.studentNumber} • ${studentSummary.present}/${studentSummary.totalRecords} present',
                    ),"""
          if old_row not in text:
              raise SystemExit("Admin report student summary row not found")
          text = text.replace(old_row, new_row, 1)
          admin.write_text(text, encoding="utf-8")

          # Hard verification: the new Web build must contain the course-based
          # calculation and the unique-session model must remain sessionId-based.
          required = [
              "class CourseAttendanceSummary",
              "summarizeByCourse",
              "'Attendance by course'",
              "record.sessionTitle.trim().toLowerCase()",
              "sessions/{sessionId}",
          ]
          for needle in required:
              if needle == "sessions/{sessionId}":
                  # This is verified by the source service's collection path.
                  service = (root / "lib/services/attendance_service.dart").read_text(
                      encoding="utf-8"
                  )
                  if ".collection('sessions').doc()" not in service:
                      raise SystemExit(
                          "Unique session-instance creation was not found; refusing to continue."
                      )
              elif needle not in (
                  report.read_text(encoding="utf-8")
                  + student.read_text(encoding="utf-8")
                  + admin.read_text(encoding="utf-8")
              ):
                  raise SystemExit(f"Named-session update verification failed: {needle}")

          print(
              "Named-session attendance percentage applied: per student + per course, "
              "using each unique session instance and present/absent records."
          )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Configure Web platform
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter create . --platforms=web

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase Web non-interactively
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          firebase apps:list --project attendence-uict-bbit --json > "$RUNNER_TEMP/firebase-apps.json"

          WEB_APP_ID="$(python3 - "$RUNNER_TEMP/firebase-apps.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          result=d.get("result", d)
          if isinstance(result, list):
              apps=result
          elif isinstance(result, dict):
              apps=result.get("apps", [])
          else:
              apps=[]
          web=[a for a in apps if str(a.get("platform","")).upper() in ("WEB","WEB_APP")]
          if not web:
              raise SystemExit("No Firebase Web app is registered in attendence-uict-bbit")
          print(web[0]["appId"])
          PY
          )"
          test -n "$WEB_APP_ID"

          firebase apps:sdkconfig WEB "$WEB_APP_ID" --project attendence-uict-bbit --json > "$RUNNER_TEMP/firebase-web-config.json"

          python3 - "$RUNNER_TEMP/firebase-web-config.json" <<'PY'
          import json, sys
          from pathlib import Path
          cfg=json.load(open(sys.argv[1]))
          cfg=cfg.get("result", cfg)
          if isinstance(cfg, dict) and "sdkConfig" in cfg:
              cfg=cfg["sdkConfig"]
          if isinstance(cfg, list):
              cfg=cfg[0] if cfg else {}
          web=cfg.get("configuration") or cfg.get("web") or cfg
          required=["apiKey","appId","messagingSenderId","projectId"]
          missing=[k for k in required if not web.get(k)]
          if missing:
              raise SystemExit("Missing Firebase Web config fields: "+", ".join(missing))
          def dart(v): return json.dumps(v)
          lines=[
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  static FirebaseOptions get currentPlatform => web;",
              "",
              "  static const FirebaseOptions web = FirebaseOptions(",
              f"    apiKey: {dart(web['apiKey'])},",
              f"    appId: {dart(web['appId'])},",
              f"    messagingSenderId: {dart(web['messagingSenderId'])},",
              f"    projectId: {dart(web['projectId'])},",
          ]
          for k in ["authDomain","storageBucket","measurementId"]:
              if web.get(k):
                  lines.append(f"    {k}: {dart(web[k])},")
          lines += ["  );", "}", ""]
          out=Path("lib/firebase_options.dart")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines))
          print("Generated", out)
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path(".")
          opts=root/"lib"/"firebase_options.dart"
          if not opts.exists():
              raise SystemExit("firebase_options.dart was not generated")
          target=None
          for p in root.rglob("*.dart"):
              if p.name == "firebase_options.dart":
                  continue
              t=p.read_text(errors="ignore")
              if "Firebase.initializeApp()" in t:
                  target=p
                  break
          if target is None:
              raise SystemExit("No Firebase.initializeApp() call found")
          text=target.read_text()
          rel=Path(__import__("os").path.relpath(opts, target.parent)).as_posix()
          imp=f"import '{rel}';"
          if imp not in text:
              lines=text.splitlines()
              i=0
              while i<len(lines) and (lines[i].startswith("import ") or lines[i].strip()=="" or lines[i].startswith("///") or lines[i].startswith("//")):
                  i+=1
              lines.insert(i, imp)
              text="\n".join(lines)+("\n" if text.endswith("\n") else "")
          text=text.replace("Firebase.initializeApp()", "Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform)")
          target.write_text(text)
          print(f"Configured Firebase initialization in {target}")
          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build Web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build web --release

      - name: Deploy Web to Firebase Hosting
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s\n' '{"projects":{"default":"attendence-uict-bbit"},"targets":{"attendence-uict-bbit":{"hosting":{"uict-site":["attendence-uict-bbit"]}}}}' > .firebaserc
          printf '%s\n' '{"hosting":{"public":"build/web","ignore":["firebase.json","**/.*","**/node_modules/**"],"cleanUrls":false,"headers":[{"source":"**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}]}}' > firebase.json
          firebase deploy --only hosting:attendence-uict-bbit --project attendence-uict-bbit --non-interactive

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: uict-attendance-web
          path: ${{ env.PROJECT_ROOT }}/build/web
          if-no-files-found: error
