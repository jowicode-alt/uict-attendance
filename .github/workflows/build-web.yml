name: UICT Web Maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create maintenance page
        shell: bash
        run: |
          set -euo pipefail
          rm -rf maintenance
          mkdir -p maintenance
          cat > maintenance/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,nofollow">
            <title>UICT ATTENDANCE — Maintenance</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #f7f9fc;
                color: #0B1F3A;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
              }
              .card {
                width: min(520px, 100%);
                padding: 42px 28px;
                background: #fff;
                border-radius: 18px;
                box-shadow: 0 10px 35px rgba(11,31,58,.10);
              }
              .title { font-size: 30px; font-weight: 800; margin-bottom: 18px; }
              .status { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
              .message {
                margin: 0 auto;
                max-width: 430px;
                color: #526174;
                font-size: 16px;
                line-height: 1.6;
              }
              .brand { margin-top: 26px; font-size: 13px; color: #7a8798; }
            </style>
          </head>
          <body>
            <main class="card">
              <div class="title">UICT ATTENDANCE</div>
              <div class="status">Temporarily unavailable</div>
              <p class="message">
                The web version is currently under maintenance while we make improvements.
                Please check back later.
              </p>
              <div class="brand">Built by DIGITAL DYNAMOS</div>
            </main>
          </body>
          </html>
          HTML

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy maintenance page
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "maintenance",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "cleanUrls": false,
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "no-store, no-cache, must-revalidate, max-age=0"
                    }
                  ]
                }
              ]
            }
          }
          JSON
          cat > .firebaserc <<'JSON'
          {
            "projects": {"default": "attendence-uict-bbit"},
            "targets": {
              "attendence-uict-bbit": {
                "hosting": {"uict-site": ["attendence-uict-bbit"]}
              }
            }
          }
          JSON
          firebase deploy --only hosting:attendence-uict-bbit --project attendence-uict-bbit --non-interactive
