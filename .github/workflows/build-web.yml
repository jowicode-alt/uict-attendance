name: Build Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q UICT_ATTENDANCE_Source_v1.0.0.zip -d source
          ROOT="$(find source -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply requested branding update only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          replacements = {
              'Built by WIZZARD NATION': 'Built by DIGITAL DYNAMOS',
              'Built by Wizzard Nation': 'Built by DIGITAL DYNAMOS',
              'WIZZARD NATION': 'DIGITAL DYNAMOS',
              'Wizzard Nation': 'DIGITAL DYNAMOS',
              'wizzard nation': 'digital dynamos',
          }
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in {'.git', 'build', '.dart_tool'} for part in p.parts):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new = text
              for old, value in replacements.items():
                  new = new.replace(old, value)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Branding files changed:', changed if changed else 'none')
          PY

      - name: Remove Wi-Fi verification only
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              p=Path(path)
              if not p.exists():
                  raise SystemExit(f"Required source file missing: {path}")
              old=p.read_text(encoding="utf-8")
              new=transform(old)
              p.write_text(new,encoding="utf-8")
              print(f"updated {path}: {old.count(chr(10))} -> {new.count(chr(10))} lines")

          # Keep the data model backward-compatible. Wi-Fi settings may still exist in
          # stored documents, but they are no longer used as attendance proof.
          def model(s):
              return re.sub(
                  r"(?m)^\s*bool get isConfigured =>.*$",
                  "  bool get isConfigured => campusLocation != null && radiusMeters > 0;",
                  s,
                  count=1,
              )
          edit("lib/models/attendance_models.dart",model)

          def service(s):
              s=s.replace("import 'package:network_info_plus/network_info_plus.dart';\n","")
              s=s.replace("  final NetworkInfo _networkInfo = NetworkInfo();\n","")
              s=s.replace("    required List<String> wifiSsids,\n","")
              # Remove Wi-Fi named arguments from every call while preserving all other arguments.
              s=re.sub(r"(?m)^\s*wifiSsids:\s*[^,\n]+,\s*\n","",s)
              # Remove stored wifiSsid map entries only.
              s=re.sub(r"(?m)^\s*['\"]wifiSsid['\"]:\s*[^,\n]+,\s*\n","",s)
              # Remove simple Wi-Fi discovery assignments.
              s=re.sub(r"(?m)^\s*(?:final|var)\s+wifiName\s*=.*\n","",s)
              # Remove an if-block only when that block itself contains the Wi-Fi allow-list check.
              lines=s.splitlines()
              out=[]
              i=0
              while i<len(lines):
                  if "allowedWifiSsids" in lines[i]:
                      # This is a safety net: delete the enclosing if block, not arbitrary
                      # surrounding code. The source remains valid for all other checks.
                      start=i
                      while start>0 and not re.match(r"\s*if\s*\(",lines[start]):
                          start-=1
                      if start>=0 and re.match(r"\s*if\s*\(",lines[start]):
                          depth=0
                          opened=False
                          j=start
                          while j<len(lines):
                              depth += lines[j].count("{")-lines[j].count("}")
                              opened |= "{" in lines[j]
                              if opened and depth<=0:
                                  break
                              j+=1
                          if j<len(lines):
                              i=j+1
                              continue
                  if "getWifiName" in lines[i] or "_networkInfo" in lines[i]:
                      i+=1
                      continue
                  out.append(lines[i])
                  i+=1
              return "\n".join(out)+"\n"
          edit("lib/services/attendance_service.dart",service)

          def admin(s):
              s=s.replace("  final _wifi = TextEditingController();\n","")
              s=s.replace("    _wifi.text = settings.allowedWifiSsids.join(', ');\n","")
              s=s.replace("    _wifi.dispose();\n","")
              s=s.replace("        wifiSsids: _wifi.text.split(','),\n","")
              s=s.replace("if (_wifi.text.trim().isEmpty || latitude == null || longitude == null)",
                          "if (latitude == null || longitude == null)")
              s=s.replace("'Enter Wi-Fi names and capture or enter valid campus coordinates.'",
                          "'Capture or enter valid campus coordinates.'")
              s=s.replace("Students must match both an approved Wi-Fi name and the GPS radius below. Wi-Fi names are case-sensitive.",
                          "Students must be inside the approved GPS attendance area below and use the live session QR or code.")
              s=re.sub(r"\n\s*TextField\(\n\s*controller:\s*_wifi,.*?\n\s*const SizedBox\(height:\s*14\),","",s,count=1,flags=re.S)
              return s
          edit("lib/screens/admin_settings_page.dart",admin)

          def student(s):
              return re.sub(
                  r"\n\s*const RequirementRow\(\n\s*icon:\s*Icons\.wifi,\n\s*text:\s*'Connect to the approved classroom Wi-Fi',\n\s*\),",
                  "",
                  s,
                  count=1,
              )
          edit("lib/screens/student_dashboard.dart",student)

          def rules(s):
              s=s.replace("        && request.resource.data.wifiSsid in settings.allowedWifiSsids\n","")
              s=s.replace("'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'",
                          "'deviceId', 'location', 'accuracyMeters', 'checkedAt'")
              return s
          edit("firestore.rules",rules)

          print("Wi-Fi is removed from attendance verification; GPS, QR/code, sessions, device checks and all other checks remain.")
          PY

          echo "=== Wi-Fi verification references after patch ==="
          grep -RniE 'network_info_plus|getWifiName|_networkInfo|wifiSsid|allowedWifiSsids|approved classroom Wi-Fi'             --include='*.dart' --include='*.rules' lib firestore.rules 2>/dev/null || true

          # The stored Wi-Fi configuration model is intentionally retained for compatibility.
          # It must not be used by the attendance service or Firestore attendance proof.
          if grep -RniE 'network_info_plus|getWifiName|_networkInfo|wifiSsid|allowedWifiSsids'               --include='*.dart' lib/services/attendance_service.dart firestore.rules; then
            echo "ERROR: Wi-Fi is still referenced by attendance verification."
            exit 1
          fi
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Configure Web platform
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter create . --platforms=web

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase Web non-interactively
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"

          firebase apps:list --project attendence-uict-bbit --json > "$RUNNER_TEMP/firebase-apps.json"

          WEB_APP_ID="$(python3 - "$RUNNER_TEMP/firebase-apps.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          result=d.get("result", d)
          if isinstance(result, list):
              apps=result
          elif isinstance(result, dict):
              apps=result.get("apps", [])
          else:
              apps=[]
          web=[a for a in apps if str(a.get("platform","")).upper() in ("WEB","WEB_APP")]
          if not web:
              raise SystemExit("No Firebase Web app is registered in attendence-uict-bbit")
          print(web[0]["appId"])
          PY
          )"
          test -n "$WEB_APP_ID"

          firebase apps:sdkconfig WEB "$WEB_APP_ID" --project attendence-uict-bbit --json > "$RUNNER_TEMP/firebase-web-config.json"

          python3 - "$RUNNER_TEMP/firebase-web-config.json" <<'PY'
          import json, sys
          from pathlib import Path
          cfg=json.load(open(sys.argv[1]))
          cfg=cfg.get("result", cfg)
          if isinstance(cfg, dict) and "sdkConfig" in cfg:
              cfg=cfg["sdkConfig"]
          if isinstance(cfg, list):
              cfg=cfg[0] if cfg else {}
          web=cfg.get("configuration") or cfg.get("web") or cfg
          required=["apiKey","appId","messagingSenderId","projectId"]
          missing=[k for k in required if not web.get(k)]
          if missing:
              raise SystemExit("Missing Firebase Web config fields: "+", ".join(missing))
          def dart(v): return json.dumps(v)
          lines=[
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  static FirebaseOptions get currentPlatform => web;",
              "",
              "  static const FirebaseOptions web = FirebaseOptions(",
              f"    apiKey: {dart(web['apiKey'])},",
              f"    appId: {dart(web['appId'])},",
              f"    messagingSenderId: {dart(web['messagingSenderId'])},",
              f"    projectId: {dart(web['projectId'])},",
          ]
          for k in ["authDomain","storageBucket","measurementId"]:
              if web.get(k):
                  lines.append(f"    {k}: {dart(web[k])},")
          lines += ["  );", "}", ""]
          out=Path("lib/firebase_options.dart")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(lines))
          print("Generated", out)
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path(".")
          opts=root/"lib"/"firebase_options.dart"
          if not opts.exists():
              raise SystemExit("firebase_options.dart was not generated")
          target=None
          for p in root.rglob("*.dart"):
              if p.name == "firebase_options.dart":
                  continue
              t=p.read_text(errors="ignore")
              if "Firebase.initializeApp()" in t:
                  target=p
                  break
          if target is None:
              raise SystemExit("No Firebase.initializeApp() call found")
          text=target.read_text()
          rel=Path(__import__("os").path.relpath(opts, target.parent)).as_posix()
          imp=f"import '{rel}';"
          if imp not in text:
              lines=text.splitlines()
              i=0
              while i<len(lines) and (lines[i].startswith("import ") or lines[i].strip()=="" or lines[i].startswith("///") or lines[i].startswith("//")):
                  i+=1
              lines.insert(i, imp)
              text="\n".join(lines)+("\n" if text.endswith("\n") else "")
          text=text.replace("Firebase.initializeApp()", "Firebase.initializeApp(options: DefaultFirebaseOptions.currentPlatform)")
          target.write_text(text)
          print(f"Configured Firebase initialization in {target}")
          PY

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build Web
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter build web --release

      - name: Deploy Web to Firebase Hosting
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s\n' '{"projects":{"default":"attendence-uict-bbit"},"targets":{"attendence-uict-bbit":{"hosting":{"uict-site":["attendence-uict-bbit"]}}}}' > .firebaserc
          printf '%s\n' '{"hosting":{"public":"build/web","ignore":["firebase.json","**/.*","**/node_modules/**"],"cleanUrls":false,"headers":[{"source":"**","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}]}}' > firebase.json
          firebase deploy --only hosting:attendence-uict-bbit --project attendence-uict-bbit --non-interactive

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: uict-attendance-web
          path: ${{ env.PROJECT_ROOT }}/build/web
          if-no-files-found: error
