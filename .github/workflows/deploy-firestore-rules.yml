name: Deploy Firestore Rules Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-firestore-rules.yml"
      - "UICT_ATTENDANCE_Source_*.zip"

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          ARCHIVE="$(find . -maxdepth 1 -type f -name 'UICT_ATTENDANCE_Source_*.zip' | sort -V | tail -n 1)"
          test -n "$ARCHIVE"
          echo "Using source archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d source
          ROOT="$(find source -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Remove only Wi-Fi attendance requirement and stale display-field equality checks
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("firestore.rules")
          if not p.exists():
              raise SystemExit("firestore.rules not found")

          s = p.read_text(encoding="utf-8")

          wifi_rule = "        && request.resource.data.wifiSsid in settings.allowedWifiSsids\n"
          if wifi_rule not in s:
              raise SystemExit("Expected Wi-Fi attendance rule was not found; refusing to publish an unverified rules change.")
          s = s.replace(wifi_rule, "", 1)

          # Wi-Fi is no longer an attendance requirement, but older clients may
          # still send wifiSsid. Keep the field allowed without validating it.
          old_keys = "'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'"
          new_keys = "'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'"
          if old_keys not in s:
              raise SystemExit("Expected attendance key list was not found; refusing to publish an unverified rules change.")
          s = s.replace(old_keys, new_keys, 1)

          for check in [
              "        && request.resource.data.studentName == student.fullName\n",
              "        && request.resource.data.studentNumber == student.studentNumber\n",
              "        && request.resource.data.sessionTitle == session.title\n",
              "        && request.resource.data.proofType == proof.type\n",
          ]:
              if check not in s:
                  raise SystemExit("Expected stale student display-field check was not found; refusing to publish an unverified rules change.")
              s = s.replace(check, "", 1)

          if "request.resource.data.wifiSsid in settings.allowedWifiSsids" in s:
              raise SystemExit("Wi-Fi attendance validation remains in firestore.rules; refusing to publish.")

          if "allowedWifiSsids" in s:
              raise SystemExit("Wi-Fi settings dependency remains in firestore.rules; refusing to publish.")

          if any(x in s for x in [
              "request.resource.data.studentName == student.fullName",
              "request.resource.data.studentNumber == student.studentNumber",
              "request.resource.data.sessionTitle == session.title",
              "request.resource.data.proofType == proof.type",
          ]):
              raise SystemExit("Stale client-display/proof-metadata equality checks remain; refusing to publish.")

          # Replace the attendance authorization helper with a compatibility-safe
          # server-side check. Keep authentication, student status, open session,
          # active proof, device binding and GPS radius. Do not depend on optional
          # display metadata, Wi-Fi, or the separate attendanceState document.
          start = s.find("    function validStudentAttendance(sessionId, studentId) {")
          end = s.find("\n    match /sessions/{sessionId} {", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate validStudentAttendance helper; refusing to publish.")
          helper = """    function validStudentAttendance(sessionId, studentId) {
                let student = get(userPath(studentId)).data;
                let proof = get(
                  /databases/$(database)/documents/attendanceProofs/$(request.resource.data.proofHash)
                ).data;
                let session = get(
                  /databases/$(database)/documents/sessions/$(sessionId)
                ).data;
                return isSelf(studentId)
                  && student.role == 'student'
                  && student.status == 'active'
                  && student.deviceId == request.resource.data.deviceId
                  && session.status == 'open'
                  && proof.active == true
                  && proof.sessionId == sessionId
                  && proof.expiresAt > request.time
                  && request.resource.data.sessionId == sessionId
                  && request.resource.data.studentUid == studentId
                  && request.resource.data.status == 'present'
                  && request.resource.data.location is latlng
                  && request.resource.data.accuracyMeters is number
                  && request.resource.data.checkedAt == request.time
                  && request.resource.data.keys().hasOnly([
                    'sessionId', 'sessionTitle', 'studentUid', 'studentName',
                    'studentNumber', 'status', 'proofType', 'proofHash',
                    'deviceId', 'wifiSsid', 'location', 'accuracyMeters', 'checkedAt'
                  ]);
              }
          """

          s = s[:start] + helper + s[end:]

          required = [
              "proofType",
              "deviceId",
              "accuracyMeters",
              "request.resource.data.location is latlng",
              "checkedAt",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit("Safety check failed; required attendance security checks are missing: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("Verified attendance rules: authenticated active student, open session, active proof/session binding, registered device, location data and server timestamp; no Wi-Fi, settings, display-metadata, or attendanceState dependency.")
          PY

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules only
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project attendence-uict-bbit --non-interactive
