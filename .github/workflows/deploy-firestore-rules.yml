name: Deploy Firestore Rules Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/deploy-firestore-rules.yml"
      - "firestore.rules"

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Firestore rules file
        shell: bash
        run: |
          set -euo pipefail
          test -s firestore.rules
          grep -q "service cloud.firestore" firestore.rules
          grep -q "match /users/{uid}" firestore.rules
          grep -q "match /sessions/{sessionId}" firestore.rules
          echo "Using repository firestore.rules only; Android/Web source archives are not touched."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules only
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FIREBASE_SERVICE_ACCOUNT:?Missing FIREBASE_SERVICE_ACCOUNT secret}"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules --project attendence-uict-bbit --non-interactive
